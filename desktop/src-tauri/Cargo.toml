[package]
name = "PersonalDesk"
version = "0.15.76"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.95"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "personal_desk_lib"
crate-type = ["rlib"]

[[bin]]
name = "PersonalDesk"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
personal-desk = { path = "../.." }
arboard = "3"
rfd = "0.17"

open = "5"
chrono = "0.4"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
uuid = { version = "1", features = ["v4"] }
