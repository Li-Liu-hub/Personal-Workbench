# 官网网申模板目录
# 说明：
# - url_patterns / markers / ignore_sections 都是不区分大小写的正则。
# - URL 命中权重最高；没有命中 URL 时，至少命中 2 个 markers 才会识别为该模板。
# - hints 是给自动填写引擎的提示，不影响手动 fill/plan。
# - 新站点可以在这里追加；也可以只在 config.yaml 的 sites 下写局部覆盖。
version: 1

defaults:
  # 这些分区默认不自动填写，避免把求职者姓名/电话填进家属、证明人或登录框。
  ignore_sections:
    - '家庭(成员|状况|信息)?'
    - '亲属|亲友|社会关系'
    - '推荐人|内推人|证明人'
    - '登录|注册|验证码|密码'
  next_buttons:
    - '下一步'
    - '继续'
    - '下一步骤'
    - '保存并下一步'
    - '保存并继续'
    - '确认并继续'
    - 'Next'
    - 'Continue'
    - 'Save and Continue'
  final_buttons:
    - '预览并提交'
    - '提交申请'
    - '提交简历'
    - '确认提交'
    - '确认投递'
    - '完成投递'
    - '提交报名'
    - 'Submit Application'
    - 'Submit application'
    - 'Submit'

templates:
  - id: moka
    name: Moka 招聘
    vendor: Moka
    priority: 100
    url_patterns:
      - 'app\.mokahr\.com'
      - 'mokahr\.com'
    markers:
      - 'mokahr'
      - 'sd-Input-input'
      - 'required-asterisk'
      - 'campus-recruitment'
      - 'campus_apply'
    hints:
      upload_first: true
      resume_parse_wait_seconds: 4
      searchable_select: true
      split_dates: true
      login_modal: true
      multi_step: false
      stop_before_preview: true
    ignore_sections:
      - '家庭状况'
      - '本人与本公司的亲友关系'
      - '手机号登录'
      - '邮箱登录'
    entry_buttons: ['申请职位', '立即投递', '投递简历']
    next_buttons: ['下一步']
    final_buttons: ['预览并提交']
    notes: '已用雅迪校招真实表单验证：45+ 字段、自定义下拉、年/月拆分、登录弹窗、声明勾选。'

  - id: beisen
    name: 北森 iTalent / 招聘门户
    vendor: 北森
    priority: 90
    url_patterns:
      - '\.zhiye\.com'
      - 'beisen\.com'
    markers:
      - 'feo\.bstatics\.com'
      - 'ux-recruitment-portal'
      - 'Powered by Beisen'
      - 'zhiye\.com'
    hints:
      login_modal: true
      multi_step: true
      upload_first: false
    entry_buttons: ['立即投递', '申请职位', '投递简历']
    final_buttons: ['提交申请', '确认提交', '完成投递']
    notes: 'React SPA + styled-components 哈希类名，按钮多重复；入口通常需要登录。'

