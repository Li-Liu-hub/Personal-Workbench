[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "officialapply"
version = "0.1.0"
description = "企业官网投递助手：通用表单检查、资料填写、附件上传与提交记录"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "websocket-client>=1.8",
]

[project.scripts]
officialapply = "officialapply.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/officialapply"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
indent-width = 4
