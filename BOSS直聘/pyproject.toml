[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bosshunter"
version = "3.0.0"
description = "BOSS直聘岗位搜索与投递 MCP/CLI 工具"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "fonttools[woff]>=4.28",
    "websocket-client>=1.8",
]

[project.scripts]
bosshunter = "bosshunter.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/bosshunter"]
artifacts = [
    "src/bosshunter/data/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
indent-width = 4
