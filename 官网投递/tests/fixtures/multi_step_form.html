<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>多步网申 - 后端开发工程师</title>
  <style>
    body { font-family: "Microsoft YaHei", sans-serif; max-width: 760px; margin: 40px auto; }
    .field { margin: 14px 0; }
    .field label { display: inline-block; min-width: 120px; }
    input[type=text] { width: 260px; padding: 5px; }
    .blockTitle { font-size: 17px; font-weight: 700; margin: 20px 0 10px; }
  </style>
</head>
<body>
  <h1>后端开发工程师（多步网申）</h1>
  <form id="applyForm" onsubmit="return false">
    <section id="step1">
      <div class="blockTitle">基本信息</div>
      <div class="apply-field">
        <label>姓名 <span class="required-asterisk">*</span></label>
        <input id="name" type="text" required>
      </div>
      <div class="apply-field">
        <label>手机号 <span class="required-asterisk">*</span></label>
        <input id="phone" type="text" required>
      </div>
      <div class="apply-field">
        <button type="button" id="nextBtn" onclick="goNext()">下一步</button>
      </div>
    </section>

    <section id="step2" style="display: none;">
      <div class="blockTitle">教育背景</div>
      <div class="apply-field">
        <label>毕业院校 <span class="required-asterisk">*</span></label>
        <input id="school" type="text" required>
      </div>
      <div class="apply-field">
        <label>专业 <span class="required-asterisk">*</span></label>
        <input id="major" type="text" required>
      </div>
      <div class="apply-field">
        <button type="button" id="submitBtn"
                onclick="document.body.dataset.submitted='1'; document.getElementById('result').textContent='申请已提交';">
          提交申请
        </button>
      </div>
    </section>
    <div id="result"></div>
  </form>
  <script>
    function goNext() {
      document.getElementById('step1').style.display = 'none';
      document.getElementById('step2').style.display = 'block';
    }
  </script>
</body>
</html>
